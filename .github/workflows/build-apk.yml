name: Compilar APK Cacao y Garra 593

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y preparar Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Poner logo de ChocoPaw como icono oficial
        run: |
          if [ -f "www/logo.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
              convert www/logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher.png
              convert www/logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher_round.png
              convert www/logo.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher_foreground.png
            done
          fi

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Cacao-y-Garra-593-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
